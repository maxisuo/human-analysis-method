# Railway configuration for human-analysis-method
# https://railway.app/railway.schema.json

[build]
builder = "nixpacks"
buildCommand = "npm ci --only=production"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[variables]
NODE_ENV = "production"
PORT = "3001"
